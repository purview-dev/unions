name: PR

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not one of the default activity types, so a draft PR would never
    # re-evaluate the required build gate once it is marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      # The runtime project is packable and carries the merged generator and code fix, so pack and
      # validate the produced package.
      run-pack: true
      validate-pack: true
    secrets: inherit

  # Agent skills are committed to .agents/skills and recorded in skills-lock.json. Verify the installed set
  # on every PR; installing or updating is a deliberate local step and never part of a build.
  skills:
    name: Verify agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the SDK global.json pins. `actions/setup-dotnet`'s `global-json-file` input is not a
      # substitute: when it cannot install the pin it falls back to the LTS channel, reports success and
      # leaves the first dotnet command to fail with "A compatible .NET SDK was not found".
      - uses: purview-dev/build/actions/dotnet-sdk@main

      - name: Verify the installed skills match the lockfile
        shell: pwsh
        run: |
          ./scripts/restore-dotnet-tools.ps1
          dotnet restore src/src/Unions/Unions.csproj
          dotnet msbuild src/src/Unions/Unions.csproj -t:CheckPurviewSkills
          dotnet msbuild src/src/Unions/Unions.csproj -t:VerifyPurviewSkills

  # Every other job builds against ProjectReferences; this one builds what ships. It packs Purview.Unions
  # to an isolated feed, then builds and runs a net10.0 and a net11.0 console against the package only,
  # leak-scans their output for compiler-host assemblies, and proves every ForbiddenContent rule rejects a
  # package. `just smoke-packed-consumers` and `just verify-pack-rules` run the same locally.
  packed-consumers:
    name: Packed consumers (net10.0 and net11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The SDK global.json pins (11.0.100), through the organisation's one SDK-setup action. See the
      # skills job for why `actions/setup-dotnet`'s `global-json-file` input is not used.
      - uses: purview-dev/build/actions/dotnet-sdk@main

      # The net10.0 consumer has to execute, so it needs the .NET 10 runtime as well as the pinned SDK.
      # This is a second runtime for that consumer, not a second opinion on the SDK: global.json still
      # selects 11.0.100 for every dotnet command.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Proves the .NET 10 polyfill path and the .NET 11 BCL path
        shell: pwsh
        run: ./scripts/test-packed-consumers.ps1 -PackOutput artifacts/packed

      - name: Prove every pack-validation forbidden-content rule rejects a package
        shell: pwsh
        run: |
          ./scripts/restore-dotnet-tools.ps1
          ./scripts/test-pack-validation-rules.ps1 -PackagesFolder artifacts/packed
